<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuizSync | Register</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef3ff, #f8f9ff);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-container {
            width: 440px;
            background: white;
            padding: 38px;
            border-radius: 22px;
            box-shadow: 0 20px 60px rgba(40, 60, 120, 0.12);
        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .logo-box {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: linear-gradient(135deg, #4776ff, #6c4cff);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
        }

        .logo span {
            font-size: 24px;
            font-weight: bold;
            color: #172033;
        }

        h1 {
            text-align: center;
            color: #172033;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #7b8495;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #30394d;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dfe4ef;
            border-radius: 10px;
            outline: none;
            margin-bottom: 15px;
            font-size: 14px;
        }

        input:focus {
            border-color: #4776ff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #4776ff;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #3866e8;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            color: #697386;
            font-size: 14px;
        }

        .login a {
            color: #4776ff;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 18px;
        }

        .back a {
            color: #697386;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="register-container">

    <div class="logo">
        <div class="logo-box">Q</div>
        <span>QuizSync</span>
    </div>

    <h1>Create Account</h1>

    <p class="subtitle">
        Join QuizSync and start competing in real time.
    </p>

    <form id="registerForm">

        <label>Full Name</label>
        <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
        >

        <label>Email</label>
        <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
        >

        <label>Username</label>
        <input
                type="text"
                id="username"
                placeholder="Create a username"
                required
        >

        <label>Password</label>
        <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="login">
        Already have an account?
        <a href="/login">Log In</a>
    </div>

    <div class="back">
        <a href="/">← Back to Home</a>
    </div>

</div>

<script>
    document.getElementById("registerForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const user = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            username: document.getElementById("username").value,
            password: document.getElementById("password").value
        };

        try {

            const response = await fetch("/api/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(user)
            });

            const result = await response.text();

            if (response.ok) {
                alert("Registration successful!");
                window.location.href = "/login";
            } else {
                alert(result);
            }

        } catch (error) {
            alert("Unable to connect to server.");
            console.error(error);
        }
    });
</script>

</body>
</html>
